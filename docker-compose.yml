services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: appdb
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Выполняется автоматически при первом старте (пустой volume):
      # таблицы app_user/record, admin/admin123, 18 тестовых записей
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    ports:
      # 5433 на хосте: 5432 обычно занят локальным PostgreSQL
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/appdb
      SPRING_DATASOURCE_USERNAME: appuser
      APP_DB_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
