<div class="login-wrap">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Вход в систему</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" autocomplete="off">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Логин</mat-label>
          <input matInput formControlName="login" name="login" required />
          @if (form.controls.login.touched && form.controls.login.hasError('required')) {
            <mat-error>Логин обязателен</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Пароль</mat-label>
          <input matInput type="password" formControlName="password" name="password" required />
          @if (form.controls.password.touched && form.controls.password.hasError('required')) {
            <mat-error>Пароль обязателен</mat-error>
          }
        </mat-form-field>

        @if (errorMessage()) {
          <p class="login-error" role="alert">{{ errorMessage() }}</p>
        }

        <button mat-flat-button color="primary" type="submit" class="full-width"
                [disabled]="form.invalid || submitting()">
          {{ submitting() ? 'Вход…' : 'Войти' }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
